version: "3.9"

services:
  web-app:
    build:
      context: ./apps/web-app
    ports:
      - "3000:3000"
    depends_on:
      - trading-service
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  trading-service:
    build:
      context: ./apps/backend-service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./apps/backend-service/app:/app/app
    restart: unless-stopped

  intelligence-service:
    build:
      context: ./apps/intelligence-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-app
      - trading-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
