version: "3.9"

services:
  web-app:
    build:
      context: ./apps/web-app
    ports:
      - "3000:3000"
    depends_on:
      - trading-service
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  trading-service:
    build:
      context: ./apps/trading-service
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  intelligence-service:
    build:
      context: ./apps/intelligence-service
    ports:
      - "8001:8000"
    env_file:
      - .env

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
